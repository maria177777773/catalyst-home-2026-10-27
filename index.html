<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "Что делает тимбилдинг-агентство Каталист?", "acceptedAnswer": {"@type": "Answer", "text": "Каталист — это тимбилдинг-агентство и ивент-агентство полного цикла: организация тимбилдинга, корпоративов и командных мероприятий под ключ в Москве и по России. С 2010 года агентство провело 4 800+ проектов. Каталист — одно из крупнейших специализированных агентств тимбилдинга в России: 50+ авторских программ и собственное производство."}}, {"@type": "Question", "name": "Как заказать тимбилдинг в Москве?", "acceptedAnswer": {"@type": "Answer", "text": "Оставьте заявку на сайте или напишите менеджеру: смету пришлём за 10 минут в рабочие часы, ежедневно с 8:00 до 22:00. Заказать тимбилдинг можно для команды от 25 до 1000+ человек."}}, {"@type": "Question", "name": "Сколько стоит организация тимбилдинга?", "acceptedAnswer": {"@type": "Answer", "text": "Проекты под ключ — от 250 000 ₽. Итоговая стоимость зависит от программы и численности: чем больше группа, тем ниже цена на участника. Минимальный заказ от 199 000 ₽, точную смету менеджер считает за 10 минут."}}, {"@type": "Question", "name": "Проводите ли вы организацию корпоративов под ключ?", "acceptedAnswer": {"@type": "Answer", "text": "Да, Каталист как агентство корпоративных мероприятий берёт на себя всё: концепцию, площадку, программу, кейтеринг, шоу и логистику. Проведение корпоративов возможно в Москве, Подмосковье и с выездом в любой регион."}}, {"@type": "Question", "name": "Чем ивент-агентство Каталист отличается от других?", "acceptedAnswer": {"@type": "Answer", "text": "Собственное производство реквизита и склад 500 м², своя школа ведущих и аниматоров, 50+ авторских программ и премия BEMA 2025 за проект с нейросетями. Рейтинг 5.0 на Яндекс Картах, ZOON и Google Maps, индекс NPS 96%."}}, {"@type": "Question", "name": "Можно ли провести тимбилдинг для сотрудников в офисе?", "acceptedAnswer": {"@type": "Answer", "text": "Да, есть компактные форматы для офиса и переговорной: квизы, творческие программы и нейро-активности. Для больших команд подойдут залы, лофты и загородные площадки Подмосковья."}}, {"@type": "Question", "name": "Организуете ли выездной корпоратив?", "acceptedAnswer": {"@type": "Answer", "text": "Да, выездной корпоратив — один из главных форматов агентства: загородные отели и поляны Подмосковья летом, залы и лофты зимой, выезды в другие города с программой и реквизитом."}}, {"@type": "Question", "name": "Какие программы заказывают чаще всего?", "acceptedAnswer": {"@type": "Answer", "text": "Топ по заказам: Фестиваль Фудтраков, городская стройка «Мегаполис», WOW Пицца, гонки «Формула-1» и тимбилдинг с нейросетями — деловая игра «Стартап», победитель премии BEMA 2025."}}, {"@type": "Question", "name": "Вы агентство праздников или только тимбилдингов?", "acceptedAnswer": {"@type": "Answer", "text": "Каталист работает как агентство праздников полного цикла: корпоративы, юбилеи компаний, конференции и выездные программы. Тимбилдинг — флагманское направление, но команда агентства организует любое корпоративное мероприятие: от концепции и площадки до шоу-программы, кейтеринга и технического продакшена."}}, {"@type": "Question", "name": "Проводите ли мастер-классы и программы с нейросетями?", "acceptedAnswer": {"@type": "Answer", "text": "Да, у Каталист отдельная линейка нейро-программ: Нейрогалерея, деловая игра «Стартап» с нейросетями (премия BEMA 2025), Музыкальный Лейбл и корпоративное обучение нейросетям для сотрудников. Мастер-класс по нейросетям встраивается в корпоратив как зона или полноценный блок программы."}}, {"@type": "Question", "name": "За сколько дней нужно заказывать корпоративное мероприятие?", "acceptedAnswer": {"@type": "Answer", "text": "Стандартная подготовка тимбилдинга занимает от одной до трёх недель: смета готова за 10 минут, реквизит и команда проекта — собственные, поэтому агентство собирает мероприятие быстрее рынка. Загородные площадки Подмосковья на июнь и июль лучше бронировать за 1-2 месяца."}}, {"@type": "Question", "name": "Работаете ли вы за пределами Москвы и Подмосковья?", "acceptedAnswer": {"@type": "Answer", "text": "Да, агентство привозит программу, реквизит и персонал в любой регион России: недавние выезды — Сочи и Казань. Для команд из регионов подбираем загородные отели с проживанием и выездной программой на полный день."}},{"@type":"Question","name":"Сколько длится тимбилдинг?","acceptedAnswer":{"@type":"Answer","text":"Стандартная программа идёт 2-3 часа. Фестивальные форматы вроде Фестиваля Фудтраков занимают от 4 часов, а выездные корпоративы с трансфером и обедом планируются на полный день."}},{"@type":"Question","name":"Что входит в стоимость тимбилдинга?","acceptedAnswer":{"@type":"Answer","text":"Цена под ключ: сценарий, ведущие и инструкторы, весь реквизит и его доставка, монтаж и демонтаж площадки, фотограф. Отдельно считается только звуковое оборудование, если его нет на площадке: звук с диджеем стоит от 45 000 ₽."}},{"@type":"Question","name":"Какие бывают виды тимбилдинга?","acceptedAnswer":{"@type":"Answer","text":"В каталоге Каталист более 50 авторских программ: бизнес-игры, спортивные и гоночные форматы, кулинарные программы, творческие мастер-классы, квесты и тимбилдинги с нейросетями."}},{"@type":"Question","name":"Какой результат даёт тимбилдинг для команды?","acceptedAnswer":{"@type":"Answer","text":"После программы сотрудники из разных отделов начинают договариваться напрямую. По опросам Каталист сплочённость растёт в 2-3 раза, оценка программ 5.0, повторно заказывают 8 из 10 клиентов."}},{"@type":"Question","name":"Как происходит оплата и какие документы вы даёте?","acceptedAnswer":{"@type":"Answer","text":"Работаем по договору с юридическими лицами и ИП, оплата безналичная на расчётный счёт, после мероприятия передаём полный пакет актов и счетов для бухгалтерии. Около 60% заказов приходит от ивент-агентств, для них есть отдельные условия."}}]}<https://catalystrussia.ru/script>
